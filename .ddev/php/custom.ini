; Custom PHP settings for nr_llm extension development
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 50M
post_max_size = 50M

; PCOV for code coverage
pcov.enabled = 1
pcov.directory = /var/www/nr_llm
