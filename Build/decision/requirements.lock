# Fully resolved, hash-pinned dependency set for the decision sidecar.
#
# GENERATED — do not hand-edit. requirements.txt holds the two direct
# dependencies; this file pins every transitive package AND its wheel digest, so
# the image installs byte-for-byte what was resolved and reviewed. The Dockerfile
# passes --require-hashes, which makes pip refuse any artifact not listed here.
#
# Regenerate deliberately (not on every build), from the repository root:
#
#   docker run --rm -v "$PWD/Build/decision/requirements.txt:/req.txt:ro" \
#     -v "$PWD/Build/decision:/out" python:3.14-slim sh -c '
#       pip download --only-binary :all: \
#         --extra-index-url https://download.pytorch.org/whl/cpu \
#         -d /wheels -r /req.txt
#       for w in /wheels/*; do pip hash "$w"; done > /out/hashes.txt'
#
# then rebuild this file from that output (one "name==version \ --hash" entry
# per downloaded wheel, sorted). Hashes are computed from the downloaded wheels,
# the same route as Build/reranker/requirements.lock, so they do not depend on
# which index publishes digests. They pin the linux/amd64 CPython 3.14 wheels
# that python:3.14-slim resolves; the image is built for that platform only.

