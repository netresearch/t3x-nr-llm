# Per-extension settings for the shared test runner — see
# .Build/vendor/netresearch/typo3-ci-workflows/assets/Build/Scripts/runTests.conf.dist
#
# Build/FunctionalTests.xml runs three testsuites; the sharded run must walk
# all three, or a suite runs in no job and still reads as covered (#272, #658).
FUNCTIONAL_PARALLEL_PATHS="Tests/Functional Tests/E2E/Backend Tests/E2E/TCA"

# -s e2e drives a browser against a running TYPO3. Locally that is this
# extension's ddev site; in CI the e2e workflow serves TYPO3 itself and passes
# TYPO3_BASE_URL, which wins over this.
E2E_BASE_URL="https://v14.nr-llm.ddev.site"

# ddev keeps its router on its own network, and *.ddev.site resolves nowhere
# else — so the e2e container needs to join it and be told the name. This is
# local-machine business, which is why it lives here and not in the shared
# runner. No ddev running, no arguments, no e2e either.
e2e_container_args() {
    # A target on this machine's loopback — Build/Scripts/screenshots.sh serves
    # TYPO3 with `php -S 127.0.0.1:PORT`. The container has its own loopback, so
    # it needs the host's network namespace to reach it. Checked FIRST: the ddev
    # branch below would otherwise win whenever ddev happens to be running and
    # put the container on a network where 127.0.0.1 is itself.
    case "${TYPO3_BASE_URL:-}" in
        *//host.docker.internal:*)
            # Build/Scripts/screenshots.sh serves TYPO3 on this machine and
            # addresses it by that name. NOT `--network host`: the runner
            # already puts the container on its own network, and docker refuses
            # a second network-mode ("cannot attach both user-defined and
            # non-user-defined network-modes"). A host alias adds a name inside
            # the network it already has.
            printf '%s' "--add-host host.docker.internal:host-gateway"
            return 0
            ;;
    esac

    # ddev keeps its router on its own network, and *.ddev.site resolves nowhere
    # else — so the e2e container needs to join it and be told the name.
    local ip
    ip=$(${CONTAINER_BIN} inspect ddev-router \
        --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null) || return 0
    [ -n "${ip}" ] || return 0
    printf '%s' "--network ddev_default --add-host v14.nr-llm.ddev.site:${ip}"
}
