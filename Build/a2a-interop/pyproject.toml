# The interop partner's packages. Both are pinned: the job measures nr-llm
# against a2a-python 1.3.0. uv.lock next to this file pins the full resolved
# tree with the sha256 of every wheel, and the image installs from that lock
# only (uv sync --locked). Change a version here, then run `uv lock` in this
# directory; the image build fails when the two files disagree.
[project]
name = "nr-llm-a2a-interop-partner"
version = "0.0.0"
description = "a2a-python 1.3.0 as interop partner of the nr_llm A2A client (spec 051 A2A-S0-5)"
# The image is python:3.12-slim; the lock is resolved for that interpreter.
requires-python = "==3.12.*"
dependencies = [
    "a2a-sdk[http-server,fastapi]==1.3.0",
    "uvicorn==0.54.0",
]

[tool.uv]
# An application, not a package: uv installs the dependencies, never this
# directory itself.
package = false
# Wheels only: no dependency's setup.py executes at build time.
no-build = true
# The image is linux/amd64 only. Resolving for that one environment keeps the
# lock to the wheels the image installs.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
