schema_version: "1.0"

preset:
  id: "typo3"
  name: "TYPO3 Extension Workflow"
  version: "0.1.0"
  description: "Adds TYPO3 extension obligations — version matrix, public API, ADRs, test suites, docs — to the Spec Kit workflow"
  author: "Netresearch DTT GmbH"
  repository: "https://github.com/netresearch/spec-kit-typo3"
  license: "MIT"

requires:
  # Pinned to the version whose composition strategies were read and tested,
  # rather than to the version that first shipped them. Lower it once an older
  # release has actually been exercised.
  speckit_version: ">=0.16.0"

# Everything here APPENDS. The preset adds obligations to whichever prompt is
# active — core's or another preset's, `lean` included — instead of replacing
# it. A replacement would be a fork of someone else's prompt, and it would stop
# tracking their improvements the day it was written.
provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/specify-typo3.md"
      description: "TYPO3 questions a specification must answer before a plan exists"
      strategy: "append"

    - type: "command"
      name: "speckit.plan"
      file: "commands/plan-typo3.md"
      description: "Repo instructions, ADRs and the API surface a TYPO3 plan must consult"
      strategy: "append"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/tasks-typo3.md"
      description: "TYPO3 obligations that are their own tasks rather than cleanup"
      strategy: "append"

tags:
  - "typo3"
  - "php"
  - "extension"
  - "compatibility"
  - "api"
