schema_version: "1.0"

preset:
  id: "typo3-llm"
  name: "TYPO3 AI Extension Workflow"
  version: "0.1.0"
  description: "Adds the questions an AI feature must answer — provider capability, untrusted output, what leaves the instance, cost, non-determinism, model drift"
  author: "Netresearch DTT GmbH"
  repository: "https://github.com/netresearch/spec-kit-typo3-llm"
  license: "MIT"

requires:
  speckit_version: ">=0.16.0"

# Stacks ON TOP of spec-kit-typo3, which is the base for every TYPO3 extension.
# Install this one at a LOWER priority number so its content lands last:
#
#   lean            priority 10
#   typo3           priority 5
#   typo3-llm       priority 3
#
# Everything appends. Nothing here restates a rule that lives in a consuming
# repository's own AGENTS.md — the base preset already sends the agent there to
# read it, and a second copy would drift from the first.
provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/specify-llm.md"
      description: "What an AI feature's specification must settle before a plan exists"
      strategy: "append"

    - type: "command"
      name: "speckit.plan"
      file: "commands/plan-llm.md"
      description: "Capability, boundary and measurement decisions an AI plan must name"
      strategy: "append"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/tasks-llm.md"
      description: "AI-specific tasks that are easy to leave out of a task list"
      strategy: "append"

tags:
  - "typo3"
  - "ai"
  - "llm"
  - "providers"
