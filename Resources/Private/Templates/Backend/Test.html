<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.page.title" default="Test LLM Provider" /></h1>

    <f:be.infobox state="-1" title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.info.title', default: 'Raw provider test')}">
        <p class="mb-0"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.info.body" default="This page sends a single prompt directly to the selected provider, bypassing tasks and configurations. Use it to confirm a provider connection works. Results are not stored." /></p>
    </f:be.infobox>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.card.send" default="Send Test Request" /></h2>
                    </div>
                    <div class="card-body">
                        <form id="testForm">
                            <div class="mb-3">
                                <label for="provider" class="form-label"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.field.provider" default="Provider" /></label>
                                <select id="provider" name="provider" class="form-select">
                                    <f:for each="{providers}" as="provider">
                                        <option value="{provider.identifier}">{provider.name}</option>
                                    </f:for>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="prompt" class="form-label"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.field.prompt" default="Prompt" /></label>
                                <textarea id="prompt" name="prompt" class="form-control" rows="4">Hello, please respond with a brief greeting to test the connection.</textarea>
                            </div>

                            <button type="submit" class="btn btn-primary mt-3">
                                <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.btn.run" default="Run Test" />
                            </button>

                            <f:link.action action="index" class="btn btn-secondary mt-3">
                                <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.btn.back" default="Back to Overview" />
                            </f:link.action>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.card.response" default="Response" /></h2>
                    </div>
                    <div class="card-body">
                        <div id="responseContainer" style="display: none;">
                            <div id="responseSuccess" class="alert alert-success" style="display: none;">
                                <strong><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.response.success" default="Success!" /></strong>
                            </div>
                            <div id="responseError" class="alert alert-danger" style="display: none;">
                                <strong><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.response.error" default="Error:" /></strong> <span id="errorMessage"></span>
                            </div>

                            <div id="responseDetails" style="display: none;">
                                <h4><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.response.content" default="Content" /></h4>
                                <pre id="responseContent" class="bg-light p-3"></pre>

                                <h4><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.response.usage" default="Usage" /></h4>
                                <table class="table table-sm">
                                    <tr>
                                        <td><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.usage.model" default="Model" /></td>
                                        <td id="responseModel"></td>
                                    </tr>
                                    <tr>
                                        <td><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.usage.promptTokens" default="Prompt Tokens" /></td>
                                        <td id="promptTokens"></td>
                                    </tr>
                                    <tr>
                                        <td><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.usage.completionTokens" default="Completion Tokens" /></td>
                                        <td id="completionTokens"></td>
                                    </tr>
                                    <tr>
                                        <td><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.usage.totalTokens" default="Total Tokens" /></td>
                                        <td id="totalTokens"></td>
                                    </tr>
                                </table>
                            </div>
                        </div>

                        <div id="loadingIndicator" style="display: none;">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.loading" default="Sending request..." /></span>
                            </div>
                            <span class="ms-2"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.loading" default="Sending request..." /></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.card.translation" default="Translation" /></h2>
                    </div>
                    <div class="card-body">
                        <p class="text-body-secondary"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.translation.info" default="Verifies a translator's credential. Leave the translator empty to use the LLM path, which needs no specialized key." /></p>
                        <form id="translationForm">
                            <div class="mb-3">
                                <label for="translationText" class="form-label"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.field.text" default="Text" /></label>
                                <textarea id="translationText" class="form-control" rows="3">Guten Tag, dies ist ein Test.</textarea>
                            </div>
                            <div class="row">
                                <div class="col mb-3">
                                    <label for="translationSource" class="form-label"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.field.sourceLanguage" default="Source language (optional)" /></label>
                                    <input type="text" id="translationSource" class="form-control" placeholder="de" />
                                </div>
                                <div class="col mb-3">
                                    <label for="translationTarget" class="form-label"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.field.targetLanguage" default="Target language" /></label>
                                    <input type="text" id="translationTarget" class="form-control" value="en" />
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="translationTranslator" class="form-label"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.field.translator" default="Translator" /></label>
                                <select id="translationTranslator" class="form-select">
                                    <option value=""><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.translator.default" default="LLM (default)" /></option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.btn.translate" default="Translate" />
                            </button>
                        </form>

                        <div id="translationLoading" class="mt-3" style="display: none;">
                            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                            <span class="ms-2"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.loading" default="Sending request..." /></span>
                        </div>
                        <div id="translationError" class="alert alert-danger mt-3" style="display: none;">
                            <span id="translationErrorMessage"></span>
                        </div>
                        <div id="translationResult" class="mt-3" style="display: none;">
                            <pre id="translationOutput" class="bg-light p-3"></pre>
                            <p class="text-body-secondary small mb-0" id="translationMeta"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.card.image" default="Image generation" /></h2>
                    </div>
                    <div class="card-body">
                        <p class="text-body-secondary"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.image.info" default="Generates one image to verify the credential. The result is shown here and not stored — putting it into the file storage is the consuming extension's job." /></p>
                        <form id="imageForm">
                            <div class="mb-3">
                                <label for="imagePrompt" class="form-label"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.field.prompt" default="Prompt" /></label>
                                <textarea id="imagePrompt" class="form-control" rows="3">A red bicycle in front of a white wall.</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="imageService" class="form-label"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.field.service" default="Service" /></label>
                                <select id="imageService" class="form-select">
                                    <option value="openai">OpenAI (DALL-E)</option>
                                    <option value="fal">FAL</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.btn.generateImage" default="Generate image" />
                            </button>
                        </form>

                        <div id="imageLoading" class="mt-3" style="display: none;">
                            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                            <span class="ms-2"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:test.loading" default="Sending request..." /></span>
                        </div>
                        <div id="imageError" class="alert alert-danger mt-3" style="display: none;">
                            <span id="imageErrorMessage"></span>
                        </div>
                        <div id="imageResult" class="mt-3" style="display: none;">
                            <img id="imagePreview" class="img-fluid rounded" alt="" />
                            <p class="text-body-secondary small mt-2 mb-0" id="imageMeta"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-body-secondary small mt-4">
        Provided by <a href="https://www.netresearch.de" target="_blank" rel="noopener">Netresearch DTT GmbH</a>
    </footer>
</f:section>

</html>
