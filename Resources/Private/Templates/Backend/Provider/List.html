<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <div>
        <h1><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.list.title" default="LLM Providers" /></h1>

        <f:be.infobox state="-1">
            <p class="mb-0"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:module.adminOnly" default="This module is admin-only. Records and actions here affect every editor using LLM features." /></p>
        </f:be.infobox>

        <div class="mb-3">
            <strong><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:seeAlso.heading" default="See also" />:</strong>
            <a href="{be:moduleLink(route: 'nrllm_models')}" class="badge badge-secondary text-decoration-none"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:seeAlso.next.models" default="Next: register Models" /></a>
            <a href="{be:moduleLink(route: 'nrllm_overview', arguments: '{action: \'help\'}')}" class="badge badge-secondary text-decoration-none"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:seeAlso.help" default="Open Help" /></a>
            <a href="https://docs.typo3.org/p/netresearch/nr-llm/main/en-us/" target="_blank" rel="noopener" class="badge badge-info text-decoration-none"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:seeAlso.docs" default="Read the documentation" /></a>
        </div>

        <f:render partial="Backend/Glossary" />

        <f:if condition="{providers -> f:count()}">
            <f:then>
                <div class="table-fit table-fit-wrap">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.field.name" default="Name" /></th>
                                <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.field.identifier" default="Identifier" /></th>
                                <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.field.adapterType" default="Adapter Type" /></th>
                                <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.field.endpoint" default="Endpoint" /></th>
                                <th scope="col" title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:glossary.term.vault.text')}"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.field.apiKey" default="API Key" /></th>
                                <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.field.status" default="Status" /></th>
                                <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.field.priority" default="Priority" /></th>
                                <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:analytics.col.cost" default="Cost (30d)" /></th>
                                <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:analytics.col.requests" default="Requests (30d)" /></th>
                                <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:analytics.col.tokens" default="Tokens (30d)" /></th>
                                <th scope="col" class="col-control"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:actions" default="Actions" /></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{providers}" as="provider">
                                <tr data-uid="{provider.uid}">
                                    <td>
                                        <strong>{provider.name}</strong>
                                        <f:if condition="{provider.description}">
                                            <br /><span class="text-variant">{provider.description}</span>
                                        </f:if>
                                    </td>
                                    <td><code class="text-break">{provider.identifier}</code></td>
                                    <td>
                                        <span class="badge badge-info">{provider.adapterName}</span>
                                    </td>
                                    <td>
                                        <f:if condition="{provider.endpointUrl}">
                                            <f:then>
                                                <span class="text-variant text-break">{provider.endpointUrl}</span>
                                            </f:then>
                                            <f:else>
                                                <span class="text-variant"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.endpoint.default" default="(default)" /></span>
                                            </f:else>
                                        </f:if>
                                    </td>
                                    <td>
                                        <f:if condition="{provider.hasApiKey}">
                                            <f:then>
                                                <span class="badge badge-success"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:configured" default="Configured" /></span>
                                            </f:then>
                                            <f:else>
                                                <span class="badge badge-warning"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:notSet" default="Not set" /></span>
                                            </f:else>
                                        </f:if>
                                    </td>
                                    <td>
                                        <f:if condition="{provider.isActive}">
                                            <f:then>
                                                <span class="badge badge-success"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:active" default="Active" /></span>
                                            </f:then>
                                            <f:else>
                                                <span class="badge badge-secondary"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:inactive" default="Inactive" /></span>
                                            </f:else>
                                        </f:if>
                                    </td>
                                    <td>
                                        <span class="badge badge-primary">{provider.priority}</span>
                                    </td>
                                    <td>{costByProvider.{provider.adapterType}}</td>
                                    <td>{reqByProvider.{provider.adapterType}}</td>
                                    <td>{tokByProvider.{provider.adapterType}}</td>
                                    <td class="col-control">
                                        <div class="btn-group" role="group">
                                            <a href="{editUrls.{provider.uid}}" class="btn btn-default btn-sm" title="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:edit')}" aria-label="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_common.xlf:edit')}">
                                                <core:icon identifier="actions-open" size="small" />
                                            </a>
                                            <button type="button" class="btn btn-default btn-sm js-toggle-active"
                                                    data-uid="{provider.uid}"
                                                    title="{f:if(condition: provider.isActive, then: '{f:translate(key: \'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:deactivate\')}', else: '{f:translate(key: \'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:activate\')}')}"
                                                    aria-label="{f:if(condition: provider.isActive, then: '{f:translate(key: \'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:deactivate\')}', else: '{f:translate(key: \'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:activate\')}')}">
                                                <f:if condition="{provider.isActive}">
                                                    <f:then><core:icon identifier="actions-toggle-on" size="small" /></f:then>
                                                    <f:else><core:icon identifier="actions-toggle-off" size="small" /></f:else>
                                                </f:if>
                                            </button>
                                            <button type="button" class="btn btn-default btn-sm js-test-connection"
                                                    data-uid="{provider.uid}"
                                                    data-name="{provider.name}"
                                                    title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:testConnection')}"
                                                    aria-label="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:testConnection')}">
                                                <core:icon identifier="actions-play" size="small" />
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <f:be.infobox
                    title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.empty.title', default: 'No Providers Configured')}"
                    state="-1"
                >
                    <p><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.empty.message" default="No API providers configured yet. Create your first provider to connect to LLM services." /></p>
                    <p><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:provider.empty.hint" default="Providers are the first tier of setup (Provider → Model → Configuration). Launch the Setup Wizard to add one." /></p>
                    <p><a href="{wizardUrl}" class="btn btn-primary btn-sm"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:wizard.launch" default="Launch Setup Wizard" /></a></p>
                </f:be.infobox>
            </f:else>
        </f:if>
    </div>
</f:section>

</html>
