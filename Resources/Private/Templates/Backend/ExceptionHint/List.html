<f:layout name="Module" />

<f:section name="Content">
    <f:variable name="l" value="LLL:EXT:nr_llm/Resources/Private/Language/locallang_mod_exceptions.xlf:" />
    <h1><f:translate key="{l}heading" /></h1>
    <p><f:translate key="{l}intro" /></p>
    <p>
        <f:if condition="{configuration}">
            <f:then><f:translate key="{l}configuration" arguments="{0: configuration}" /></f:then>
            <f:else><f:translate key="{l}noConfiguration" /></f:else>
        </f:if>
    </p>

    <f:if condition="{rows}">
        <f:then>
            <f:for each="{rows}" as="row">
                <section class="card mb-3" aria-labelledby="nrllm-error-{row.index}">
                    <div class="card-body">
                        <h2 class="h5" id="nrllm-error-{row.index}">{row.class -> f:or(alternative: row.level)}</h2>
                        <p class="text-body-secondary mb-1">{row.time} · {row.level}</p>
                        <p class="mb-1">{row.message}</p>
                        <f:if condition="{row.location}"><p class="mb-2"><code>{row.location}</code></p></f:if>

                        <f:if condition="{row.hint}">
                            <f:then>
                                <f:if condition="{row.hint.refused}">
                                    <f:then>
                                        <div class="alert alert-warning" role="status"><f:translate key="{l}refused" arguments="{0: row.hint.refusal}" /></div>
                                    </f:then>
                                    <f:else>
                                        <div class="alert alert-info" role="status">
                                            <h3 class="h6">
                                                <f:if condition="{row.hint.guess}">
                                                    <f:then><f:translate key="{l}hintGuess" /></f:then>
                                                    <f:else><f:translate key="{l}hint" /></f:else>
                                                </f:if>
                                            </h3>
                                            <dl class="mb-0">
                                                <dt><f:translate key="{l}cause" /></dt>
                                                <dd>{row.hint.cause}</dd>
                                                <dt><f:translate key="{l}nextStep" /></dt>
                                                <dd>{row.hint.nextStep}</dd>
                                                <f:if condition="{row.hintFrame}">
                                                    <dt><f:translate key="{l}frame" /></dt>
                                                    <dd><code>{row.hintFrame}</code></dd>
                                                </f:if>
                                            </dl>
                                            <f:if condition="{row.hint.messageWithheld}">
                                                <p class="mb-0 mt-2"><f:translate key="{l}messageWithheld" /></p>
                                            </f:if>
                                        </div>
                                    </f:else>
                                </f:if>
                            </f:then>
                            <f:else>
                                <f:form action="hint" method="post">
                                    <f:form.hidden name="index" value="{row.index}" />
                                    <button type="submit" class="btn btn-default" aria-describedby="nrllm-error-{row.index}"><f:translate key="{l}ask" /></button>
                                </f:form>
                            </f:else>
                        </f:if>
                    </div>
                </section>
            </f:for>
        </f:then>
        <f:else>
            <p><f:translate key="{l}empty" /></p>
        </f:else>
    </f:if>
</f:section>
</html>
