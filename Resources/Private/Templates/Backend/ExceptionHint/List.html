<f:layout name="Module" />

<f:section name="Content">
    <f:variable name="l" value="LLL:EXT:nr_llm/Resources/Private/Language/locallang_mod_exceptions.xlf:" />
    <h1><f:translate key="{l}heading" /></h1>
    <p><f:translate key="{l}intro" /></p>

    <section class="card mb-3" aria-labelledby="nrllm-hint-choice">
        <div class="card-body">
            <h2 class="h5" id="nrllm-hint-choice"><f:translate key="{l}choice.heading" /></h2>
            <f:if condition="{choiceDropped}">
                <div class="alert alert-warning" role="status"><f:translate key="{l}choice.dropped" /></div>
            </f:if>
            <f:if condition="{choiceRefused}">
                <div class="alert alert-warning" role="status"><f:translate key="{l}choice.refused" /></div>
            </f:if>
            <p>
                <f:if condition="{configuration}">
                    <f:then>
                        <f:translate key="{l}configuration" arguments="{0: configuration}" />
                        <f:if condition="{admission}"><f:translate key="{l}admission.{admission}" /></f:if>
                    </f:then>
                    <f:else><f:translate key="{l}noConfiguration" /></f:else>
                </f:if>
            </p>
            <f:if condition="{choices}">
                <f:form action="choose" method="post" class="mb-2">
                    <div class="row g-2 align-items-end">
                        <div class="col-auto">
                            <label class="form-label" for="nrllm-hint-configuration"><f:translate key="{l}choice.label" /></label>
                            <select class="form-select" id="nrllm-hint-configuration" name="configuration" aria-describedby="nrllm-hint-choice-help">
                                <option value="" {f:if(condition: stored, else: 'selected')}><f:translate key="{l}choice.default" arguments="{0: defaultName}" /></option>
                                <f:for each="{choices}" as="choice">
                                    <option value="{choice.identifier}" {f:if(condition: '{choice.identifier} == {stored}', then: 'selected')}>{choice.name} – <f:translate key="{l}admission.{choice.admission}" /></option>
                                </f:for>
                            </select>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-default"><f:translate key="{l}choice.save" /></button>
                        </div>
                    </div>
                </f:form>
            </f:if>
            <p class="mb-0" id="nrllm-hint-choice-help">
                <f:translate key="{l}choice.help" />
                <f:render section="Links" arguments="{links: links, l: l}" />
            </p>
        </div>
    </section>

    <f:if condition="{entryGone}">
        <div class="alert alert-warning" role="status"><f:translate key="{l}entryGone" /></div>
    </f:if>

    <f:if condition="{rows}">
        <f:then>
            <f:for each="{rows}" as="row">
                <section class="card mb-3" aria-labelledby="nrllm-error-{row.index}">
                    <div class="card-body">
                        <h2 class="h5" id="nrllm-error-{row.index}">{row.class -> f:or(alternative: row.level)}</h2>
                        <p class="text-variant mb-1">{row.time} · {row.level}</p>
                        <p class="mb-1">{row.message}</p>
                        <f:if condition="{row.location}"><p class="mb-2"><code>{row.location}</code></p></f:if>

                        <f:if condition="{row.hint}">
                            <f:then>
                                <f:if condition="{row.hint.refused}">
                                    <f:then>
                                        <div class="alert alert-warning" role="status">
                                            <p class="mb-0">
                                                <strong><f:translate key="{l}noHint" /></strong>
                                                <f:if condition="{row.refusal}">
                                                    <f:then><f:translate key="{l}refusal.{row.refusal}" arguments="{row.hint.refusalArguments}" /></f:then>
                                                    <f:else>{row.hint.refusal}</f:else>
                                                </f:if>
                                            </p>
                                            <f:if condition="{row.refusal} == 'zone_admits_no_diagnostics'">
                                                <p class="mb-0 mt-2">
                                                    <f:translate key="{l}action.zone" />
                                                    <f:render section="Links" arguments="{links: links, l: l}" />
                                                </p>
                                            </f:if>
                                            <f:if condition="{row.refusal} == 'no_configuration' || {row.refusal} == 'configuration_inactive'">
                                                <p class="mb-0 mt-2">
                                                    <f:translate key="{l}action.configuration" />
                                                    <f:render section="Links" arguments="{links: links, l: l}" />
                                                </p>
                                            </f:if>
                                        </div>
                                    </f:then>
                                    <f:else>
                                        <div class="alert alert-info" role="status">
                                            <h3 class="h6">
                                                <f:if condition="{row.hint.guess}">
                                                    <f:then><f:translate key="{l}hintGuess" /></f:then>
                                                    <f:else><f:translate key="{l}hint" /></f:else>
                                                </f:if>
                                            </h3>
                                            <dl class="mb-0">
                                                <dt><f:translate key="{l}cause" /></dt>
                                                <dd>{row.hint.cause}</dd>
                                                <dt><f:translate key="{l}nextStep" /></dt>
                                                <dd>{row.hint.nextStep}</dd>
                                                <f:if condition="{row.hintFrame}">
                                                    <dt><f:translate key="{l}frame" /></dt>
                                                    <dd><code>{row.hintFrame}</code></dd>
                                                </f:if>
                                            </dl>
                                            <f:if condition="{row.hint.messageWithheld}">
                                                <p class="mb-0 mt-2"><f:translate key="{l}messageWithheld" /></p>
                                            </f:if>
                                        </div>
                                    </f:else>
                                </f:if>
                            </f:then>
                            <f:else>
                                <f:form action="hint" method="post">
                                    <f:form.hidden name="entry" value="{row.key}" />
                                    <button type="submit" class="btn btn-default" aria-describedby="nrllm-error-{row.index}"><f:translate key="{l}ask" /></button>
                                </f:form>
                            </f:else>
                        </f:if>
                    </div>
                </section>
            </f:for>
        </f:then>
        <f:else>
            <p><f:translate key="{l}empty" /></p>
        </f:else>
    </f:if>
</f:section>

<f:section name="Links">
    <f:if condition="{links.configurations}"><a href="{links.configurations}"><f:translate key="{l}link.configurations" /></a></f:if>
    <f:if condition="{links.providers}"> · <a href="{links.providers}"><f:translate key="{l}link.providers" /></a></f:if>
</f:section>
</html>
