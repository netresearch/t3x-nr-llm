<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <div>
        <h1>
            <core:icon identifier="module-nrllm-snippet" size="medium" />
            <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.list.title" default="Term Lists" /> ({totalCount})
        </h1>

        <f:be.infobox state="-1">
            <p class="mb-0"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:module.adminOnly" default="This module is admin-only. Records and actions here affect every editor using LLM features." /></p>
        </f:be.infobox>

        <div class="mb-3">
            <strong><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:seeAlso.heading" default="See also" />:</strong>
            <a href="{be:moduleLink(route: 'nrllm_configurations')}" class="badge badge-secondary text-decoration-none"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.seeAlso.configurations" default="Configurations" /></a>
            <a href="{be:moduleLink(route: 'nrllm_overview', arguments: '{action: \'help\'}')}" class="badge badge-secondary text-decoration-none"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:seeAlso.help" default="Open Help" /></a>
            <a href="https://docs.typo3.org/p/netresearch/nr-llm/main/en-us/" target="_blank" rel="noopener" class="badge badge-info text-decoration-none"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:seeAlso.docs" default="Read the documentation" /></a>
        </div>

        <f:be.infobox state="-2">
            <p><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.intro.line1" default="A term list stops generated text: a forbidden term must not appear, a required term must. The editor reads which term stopped it." /></p>
            <p class="mb-0"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.intro.line2" default="Case is ignored and terms match whole words. There is no inflection: Rabatt does not match Rabatte, but Rabatt* matches both. A list applies only to the configurations it names." /></p>
        </f:be.infobox>

        <f:if condition="{totalCount} == 0">
            <f:then>
                <f:be.infobox
                    title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.empty.title', default: 'No Term Lists Configured')}"
                    state="-1"
                >
                    <p><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.empty.message" default="No term lists have been created yet." /></p>
                    <p><a href="{newUrl}" class="btn btn-primary btn-sm"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:btn.termList.new" default="New Term List" /></a></p>
                </f:be.infobox>
            </f:then>
            <f:else>
                <div class="card mb-4">
                    <div class="card-body p-0">
                        <div class="table-fit table-fit-wrap">
                        <table class="table table-striped table-hover mb-0">
                            <thead>
                                <tr>
                                    <th scope="col" class="col-icon"><span class="visually-hidden"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:field.status" default="Status" /></span></th>
                                    <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.col.name" default="Name" /></th>
                                    <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.col.site" default="Site" /></th>
                                    <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.col.language" default="Language" /></th>
                                    <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.col.configurations" default="Configurations" /></th>
                                    <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.col.forbidden" default="Forbidden" /></th>
                                    <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.col.required" default="Required" /></th>
                                    <th scope="col" class="col-control"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:actions" default="Actions" /></th>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{termLists}" as="termList">
                                    <tr class="{f:if(condition: '{termList.hidden}', then: 'table-secondary')}">
                                        <td class="col-icon">
                                            <f:if condition="{termList.hidden}">
                                                <f:then>
                                                    <span class="badge badge-secondary" title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.hidden')}">
                                                        <core:icon identifier="actions-close" size="small" />
                                                        <span class="visually-hidden"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.hidden" /></span>
                                                    </span>
                                                </f:then>
                                                <f:else>
                                                    <span class="badge badge-success" title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:task.title.active')}">
                                                        <core:icon identifier="actions-check" size="small" />
                                                        <span class="visually-hidden"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:task.title.active" /></span>
                                                    </span>
                                                </f:else>
                                            </f:if>
                                        </td>
                                        <td><strong>{termList.name}</strong></td>
                                        <td><f:if condition="{termList.siteIdentifier}"><f:then><code class="text-break">{termList.siteIdentifier}</code></f:then><f:else><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.allSites" default="All sites" /></f:else></f:if></td>
                                        <td><f:if condition="{termList.language}"><f:then><code class="text-break">{termList.language}</code></f:then><f:else><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:termList.allLanguages" default="All languages" /></f:else></f:if></td>
                                        <td>{termList.configurationCount}</td>
                                        <td>{termList.forbiddenCount}</td>
                                        <td>{termList.requiredCount}</td>
                                        <td class="col-control">
                                            <div class="btn-group btn-group-sm">
                                                <a href="{editUrls.{termList.uid}}" class="btn btn-default" title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:task.action.edit')}" aria-label="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:task.action.edit')}">
                                                    <core:icon identifier="actions-open" size="small" />
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </f:for>
                            </tbody>
                        </table>
                        </div>
                    </div>
                </div>
            </f:else>
        </f:if>
    </div>
</f:section>

</html>
