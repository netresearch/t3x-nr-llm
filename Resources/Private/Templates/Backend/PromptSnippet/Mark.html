<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <div>
        <h1>
            <core:icon identifier="module-nrllm-snippet" size="medium" />
            <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.title" default="Mark snippet for a caller's system message" />: {snippet.name}
        </h1>

        <p>
            <f:link.action action="list" controller="Backend\PromptSnippet" class="btn btn-default btn-sm">
                <core:icon identifier="actions-view-go-back" size="small" />
                <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.back" default="Back to snippets" />
            </f:link.action>
        </p>

        <f:be.infobox state="-1">
            <p class="mb-0"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.intro" default="When a caller such as the chat sends its own system message, a configuration's system prompt and snippets are not sent. A marked snippet is appended to that system message for configurations that opt in and select it by tag. The mark names exactly the block and the tags shown on this page; any later change to the name, the text or the tags takes the snippet out until it is marked again." /></p>
        </f:be.infobox>

        <f:if condition="{review.marked}">
            <f:then>
                <f:be.infobox state="0" title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.state.marked.title', default: 'Marked')}">
                    <p class="mb-0"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.state.marked" default="The block below is marked. Configurations that opt in append it to a caller's system message." /></p>
                </f:be.infobox>
            </f:then>
            <f:else if="{review.staleMark}">
                <f:be.infobox state="1" title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.state.stale.title', default: 'Changed since it was marked')}">
                    <p class="mb-0"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.state.stale" default="The name, the text or the tags changed after the snippet was marked. It does not reach a caller's system message until the block and tags below are marked." /></p>
                </f:be.infobox>
            </f:else>
            <f:else>
                <f:be.infobox state="-1" title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.state.unmarked.title', default: 'Not marked')}">
                    <p class="mb-0"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.state.unmarked" default="The snippet reaches a configuration's own system prompt only." /></p>
                </f:be.infobox>
            </f:else>
        </f:if>

        <f:if condition="{review.invisible -> f:count()}">
            <f:be.infobox state="2" title="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.state.invisible.title', default: 'Contains characters this page cannot show')}">
                <p><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.state.invisible" default="The model reads these characters, but a browser renders them as nothing, so the block below is not all the model would be told. It cannot be marked. Remove the characters from the snippet." /></p>
                <ul class="mb-0">
                    <f:for each="{review.invisible}" as="finding">
                        <li><code>{finding}</code></li>
                    </f:for>
                </ul>
            </f:be.infobox>
        </f:if>

        <h2><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.block" default="Block appended to a caller's system message" /></h2>
        <pre class="border rounded p-3 text-break" style="background: var(--typo3-surface-container-base); white-space: pre-wrap; border-radius: var(--typo3-component-border-radius);">{review.block}</pre>
        <h2><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.tags" default="Tags the mark is bound to" /></h2>
        <f:if condition="{review.tags -> f:count()}">
            <f:then>
                <ul>
                    <f:for each="{review.tags}" as="tag">
                        <li><code>{tag}</code></li>
                    </f:for>
                </ul>
            </f:then>
            <f:else>
                <p><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.tags.none" default="None. No configuration selects this snippet." /></p>
            </f:else>
        </f:if>
        <p class="text-variant"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.digest" default="Digest of block and tags" />: <code class="text-break">{review.digest}</code></p>

        <div class="d-flex gap-2 mb-4">
            <f:if condition="{review.marked}">
                <f:else>
                    <f:if condition="{review.digest}">
                        <f:if condition="{review.invisible -> f:count()}">
                            <f:else>
                                <f:form action="mark" controller="Backend\PromptSnippetMark" method="post">
                                    <f:form.hidden name="snippet" value="{snippet.uid}" />
                                    <f:form.hidden name="digest" value="{review.digest}" />
                                    <button type="submit" class="btn btn-primary">
                                        <core:icon identifier="actions-check" size="small" />
                                        <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.mark" default="Mark this block" />
                                    </button>
                                </f:form>
                            </f:else>
                        </f:if>
                    </f:if>
                </f:else>
            </f:if>
            <f:if condition="{snippet.callerSystemDigest}">
                <f:form action="unmark" controller="Backend\PromptSnippetMark" method="post">
                    <f:form.hidden name="snippet" value="{snippet.uid}" />
                    <button type="submit" class="btn btn-default">
                        <core:icon identifier="actions-close" size="small" />
                        <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:snippet.mark.unmark" default="Remove the mark" />
                    </button>
                </f:form>
            </f:if>
        </div>
    </div>
</f:section>

</html>
