<f:if condition="{background}">
    <f:then>
        <div class="table-fit table-fit-wrap">
            <table class="table table-striped">
                <caption class="visually-hidden"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.heading.background" default="Background runs" /></caption>
                <thead>
                    <tr>
                        <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.background.origin" default="Queued by" /></th>
                        <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.terminal.status" default="Status" /></th>
                        <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.background.queued" default="Queued" /></th>
                        <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.background.started" default="Started" /></th>
                        <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.terminal.finished" default="Finished" /></th>
                        <th scope="col" class="text-end"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.terminal.cost" default="Cost" /></th>
                        <th scope="col"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.terminal.detail" default="Detail" /></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{background}" as="run">
                        <tr>
                            <td><code class="text-break">{run.origin}</code></td>
                            <td>
                                {run.status}
                                <f:if condition="{run.failedToolSteps} > 0">
                                    <span class="badge badge-danger"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.terminal.failedToolSteps" arguments="{0: run.failedToolSteps}" default="Tool calls failed: %d" /></span>
                                </f:if>
                            </td>
                            <td class="col-datetime"><f:format.date date="@{run.createdAt}" format="Y-m-d H:i" /></td>
                            <td class="col-datetime">
                                <f:if condition="{run.startedAt} > 0"><f:format.date date="@{run.startedAt}" format="Y-m-d H:i" /></f:if>
                            </td>
                            <td class="col-datetime">
                                <f:if condition="{run.finishedAt} > 0"><f:format.date date="@{run.finishedAt}" format="Y-m-d H:i" /></f:if>
                            </td>
                            <td class="text-end">
                                <f:if condition="{run.formattedCost}">{run.formattedCost}</f:if>
                            </td>
                            <td>
                                <f:if condition="{run.openableByViewer}">
                                    <f:link.action action="show" arguments="{runUuid: run.runUuid}">
                                        <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.terminal.detailLink" default="Timeline" />
                                        <span class="visually-hidden"> {run.runUuid}</span>
                                    </f:link.action>
                                </f:if>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </div>
    </f:then>
    <f:else>
        <p class="text-variant"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.background.empty" default="No background runs. Queue one with nrllm:task:enqueue." /></p>
    </f:else>
</f:if>
