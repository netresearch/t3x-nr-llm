<f:for each="{run.pendingCalls}" as="call">
    <div class="mb-2">
        <strong><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.pendingCall" default="Pending tool call" />:</strong>
        <code>{call.name}</code>
        <f:if condition="{call.toolStillRegistered} == false">
            <span class="badge text-bg-warning"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.toolGone" default="The tool for this call is no longer registered." /></span>
        </f:if>
        <f:if condition="{call.previewStale}">
            <div class="alert alert-warning py-1 px-2 mt-1 mb-0">
                <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.previewStale" default="This record changed after the preview you approved, so nothing was written. What follows is its current state — please review it again." />
            </div>
        </f:if>
        <f:if condition="{call.previewLines}">
            <div class="mt-1">
                <strong>
                    <f:if condition="{call.previewFailed}">
                        <f:then><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.previewUnavailable" default="No preview — you are deciding without one" /></f:then>
                        <f:else><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.preview" default="What this call would do" /></f:else>
                    </f:if>:
                </strong>
                <ul class="mb-0">
                    <f:for each="{call.previewLines}" as="line">
                        <li>{line}</li>
                    </f:for>
                </ul>
                <f:if condition="{call.previewFailed} == false">
                    <small class="text-body-secondary"><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.previewCapturedAtPause" default="Captured when the run paused. If the record changes before you approve, nothing is written and you are asked again." /></small>
                </f:if>
            </div>
        </f:if>
        <details class="mt-1">
            <summary><f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.arguments" default="Arguments" /></summary>
            <pre class="mt-1 mb-0"><code>{call.argumentsJson}</code></pre>
        </details>
    </div>
</f:for>

<f:form action="approve" method="post">
    <f:form.hidden name="runUuid" value="{run.runUuid}" />
    <f:form.hidden name="turnDigest" value="{run.turnDigest}" />
    <div class="btn-group" role="group" aria-label="{f:translate(key: 'LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.decisionGroup', arguments: {0: run.configLabel})}">
        <button type="submit" name="approve" value="1" class="btn btn-primary">
            <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.approve" default="Approve" />
        </button>
        <button type="submit" name="approve" value="0" class="btn btn-default">
            <f:translate key="LLL:EXT:nr_llm/Resources/Private/Language/locallang.xlf:runs.deny" default="Deny" />
        </button>
    </div>
</f:form>
