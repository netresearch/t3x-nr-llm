# SonarQube Cloud — Automatic Analysis configuration.
#
# This file (NOT sonar-project.properties, which Automatic Analysis ignores)
# scopes SonarCloud's Automatic Analysis from the repository.

# Exclude from ALL analysis:
#  - Vendored third-party frontend libraries (the minified Chart.js UMD bundle)
#    — upstream code, not ours to scan.
#  - Fluid templates: TYPO3 view partials wrapped in `<html xmlns:f="...">` only
#    to declare ViewHelper namespaces — they are NOT standalone HTML pages, so
#    SonarCloud's Web rules (DOCTYPE / lang attribute / <title>) are false
#    positives on them.
sonar.exclusions=Resources/Public/JavaScript/Vendor/**,Resources/Private/Templates/**

# Exclude from copy-paste / duplication detection (new_duplicated_lines_density):
#  - Vendored libs and Fluid templates (as above).
#  - XLIFF translation files — the EN source and DE target files necessarily
#    mirror each other's structure; that is translation, not duplication.
#  - Test code — repeated arrange/act/assert scaffolding is idiomatic in tests.
#  - TYPO3 TCA files and the icon registry — declarative arrays whose shape is
#    dictated by the TCA schema / icon API: every table repeats the same
#    ctrl/columns scaffolding, every icon entry the same provider/source pair.
#    The repetition is the format, not copy-paste (TYPO3 convention is one
#    plain-array file per table, see Configuration/AGENTS.md).
#  - The demo data file — same reason as the TCA files above, one step
#    further: it is a generated record graph where every provider, model,
#    configuration and task repeats the same key structure by definition.
#    Hoisting a description into a constant to satisfy a duplication metric
#    would make a data record harder to read for no reader's benefit.
sonar.cpd.exclusions=Resources/Public/JavaScript/Vendor/**,Resources/Private/Templates/**,Resources/Private/Language/**,Tests/**,Configuration/TCA/**,Configuration/Icons.php,Resources/Private/Demo/**

# Per-rule ignores for two inherent/intentional findings:
#  - e1 (php:S1448, "too many methods"): the Skill/SkillSource Extbase entities
#    legitimately exceed 20 methods — one getter+setter pair per persisted
#    column is the framework's mapping convention, not a design smell.
#  - e2 (php:S5332, "clear-text protocol"): GitHubClientTest deliberately uses an
#    http:// URL to assert the client REJECTS it (HostNotAllowedException).
# ISSUE-LEVEL IGNORES DO NOT LIVE HERE — they live in the project settings.
#
# Automatic Analysis honours only a subset of sonar.* properties from this
# file. sonar.exclusions and sonar.cpd.exclusions ARE honoured; the duplication
# exclusion for Resources/Private/Demo/** above is what proved it, by removing
# that condition from a pull request's quality gate.
# sonar.issue.ignore.multicriteria is NOT.
#
# Two entries used to sit here and did nothing. e2 exempted php:S5332 under
# Tests/ and its comment named Tests/Unit/Service/Skill/GitHubClientTest.php as
# the reason; that file kept reporting that rule. e1 (php:S1448 under
# Classes/Domain/Model/**) was inert the same way.
#
# Both are now in SonarCloud's project settings — Administration › General
# Settings › Analysis Scope › Issues — where a third entry (php:S1313 under
# **/Tests/**) had been living correctly all along, which is what showed the
# mechanism works and only its location was wrong. Read them back with:
#
#   curl -H "Authorization: Bearer $SONAR_TOKEN" \
#     'https://sonarcloud.io/api/settings/values?component=netresearch_t3x-nr-llm&keys=sonar.issue.ignore.multicriteria'
#
# Three more entries apply under Tests/**, because the rules address production
# design and test code cannot comply without losing what it tests:
#  - php:S112 ("generic exception thrown"): test doubles throw a plain
#    RuntimeException to simulate a failing dependency or to guard a fixture.
#    No production code catches \RuntimeException, so a dedicated type would
#    change no behaviour.
#  - php:S1448 ("too many methods"): the methods of a test class are its test
#    cases, and a double of a 28-method interface needs 28 methods.
#  - php:S1192 ("duplicated string literal"): fixture values and expected
#    messages repeat across independent test methods, the same reason
#    Tests/** is excluded from duplication detection above.
#
# The rule php:S1142 ("too many returns") allows 9 returns here instead of 3.
# Guard clauses are the house style, and the CI Rector gate
# (PreparedValueToEarlyReturnRector) turns single-exit code back into early
# returns. The project's PHP quality profile "nr-llm (Sonar way comprehensive)"
# inherits Sonar way comprehensive and overrides only the rule's "max"
# parameter; the organisation default is unchanged. A method that needs more
# than 9 returns validates too many inputs in one place (Classes/AGENTS.md).
#
# A one-off intentional finding does not need an entry there at all: mark the
# issue Won't Fix in SonarCloud with the reason as a comment. A rule-level
# exemption, which will fire again on a file that does not exist yet, does.
#
# See #880.
