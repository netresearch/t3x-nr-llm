# Single-use observation episode; the existing merger remains active.
# Never rerun or relax these guards to manufacture a successful measurement.
name: Dependency merge intent (measure once)
'on':
  pull_request_target: # zizmor: ignore[dangerous-triggers] Trusted bot metadata only; no PR checkout; observation forbids PR/queue writes.
    types: [synchronize]
    branches: [main]
    paths: ['Build/decision/uv.lock', 'Build/reranker/uv.lock']
permissions: {}
jobs:
