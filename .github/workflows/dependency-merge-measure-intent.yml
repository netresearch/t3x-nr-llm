    if: >- # zizmor: ignore[bot-conditions] Scheduling only; the controller validates genuine current origin and complete trust evidence.
      github.run_number == '1' && github.run_attempt == '1' &&
      github.event_name == 'pull_request_target' && github.event.action == 'synchronize' &&
      github.event.repository.full_name == github.repository &&
      github.event.pull_request.number == 1197 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'renovate/lock-file-maintenance' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.actor == 'renovate[bot]'
