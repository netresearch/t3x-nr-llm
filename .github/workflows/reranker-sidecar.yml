#
# The image job builds the Dockerfile without pushing it, so a base-image update
# the lock cannot follow fails here (#1147: python 3.15, for which the locked
# wheels do not exist). Only changes to the sidecar or to this workflow run it;
# a merge-queue entry is built by its pull request already.
name: Reranker Sidecar
on:
  push:
    branches:
      - main
    paths:
      - Build/reranker/**
      - .github/workflows/reranker-sidecar.yml
  pull_request:
    paths:
      - Build/reranker/**
      - .github/workflows/reranker-sidecar.yml
  merge_group: null
  workflow_dispatch: null
permissions: {}
jobs:
  reranker-sidecar:
    uses: netresearch/.github/.github/workflows/python-ci.yml@main
    permissions:
      contents: read
    with:
      working-directory: Build/reranker
      python-versions: '["3.14"]'
      cache: ""
      install-cmd: python -m pip install ruff==0.16.9
      lint-cmd: ruff check --no-fix . && ruff format --check .
      test-cmd: python -m unittest -v test_app.py
  reranker-image:
    if: github.event_name != 'merge_group'
    uses: netresearch/.github/.github/workflows/build-container.yml@main
    # The reusable's job declares these for its push, sign and SARIF paths; with
    # push, scan, sign and attest off none is used, but a caller must grant at
    # least what the called job declares.
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image-name: nr-llm-reranker
      context: Build/reranker
      dockerfile: Build/reranker/Dockerfile
      platforms: linux/amd64
      push: false
      scan: false
      cache-scope: reranker-sidecar
