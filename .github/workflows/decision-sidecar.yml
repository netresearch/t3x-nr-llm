name: Decision Sidecar

# Runs the tests and the lock check of the local decision sidecar
# (Build/decision, ADR-211). The sidecar is the backend nr-llm's decision
# service is tested against without a paid key, so a regression in its request
# validation or its mapping of the three question types must fail a pull
# request — tests nothing runs protect nothing.
#
# The tests need only the standard library: app.py imports torch and
# transformers lazily, and test_app.py fakes the classifier, so no model is
# downloaded here. The lock check (`uv lock --check`) proves uv.lock still
# matches pyproject.toml; the image build installs from uv.lock only.
#
# The image job builds the Dockerfile without pushing it. The tests above never
# install the locked packages, so before this job a base-image update the lock
# cannot follow merged green (#1147: python 3.15, for which the locked wheels do
# not exist) and broke the image.
#
# Thin callers of the shared python-ci and build-container reusables, so the
# action pins and harden-runner stay maintained centrally. Only changes to the
# sidecar or to this workflow run it; a merge-queue entry is built by its pull
# request already, so the image job skips merge_group.

on:
  push:
    branches: [main]
    paths:
      - Build/decision/**
      - .github/workflows/decision-sidecar.yml
  pull_request:
    paths:
      - Build/decision/**
      - .github/workflows/decision-sidecar.yml
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  decision-sidecar:
    uses: netresearch/.github/.github/workflows/python-ci.yml@main
    permissions:
      contents: read
    with:
      working-directory: Build/decision
      python-versions: '["3.14"]'
      package-manager: uv
      install-cmd: python -m pip install ruff==0.16.9
      lint-cmd: ruff check --no-fix . && ruff format --check .
      test-cmd: python -m unittest -v test_app.py && uv lock --check

  decision-image:
    if: github.event_name != 'merge_group'
    uses: netresearch/.github/.github/workflows/build-container.yml@main
    # The reusable's job declares these for its push, sign and SARIF paths. With
    # push, scan, sign and attest off none of them is used, but a caller must
    # grant at least what the called job declares.
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image-name: nr-llm-decision
      context: Build/decision
      dockerfile: Build/decision/Dockerfile
      platforms: linux/amd64
      push: false
      scan: false
      cache-scope: decision-sidecar
