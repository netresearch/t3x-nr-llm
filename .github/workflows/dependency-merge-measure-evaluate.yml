# Single-use observation episode; this does not replace the existing merger.
# A blocked or missed episode stays inconclusive; do not rerun or reset it.
name: Dependency merge evaluation (measure once)
'on':
  workflow_run: # zizmor: ignore[dangerous-triggers] Completion is a hint; immutable intent, current source/head and all producer duties remain mandatory.
    workflows: [CI]
    types: [completed]
    branches: [renovate/lock-file-maintenance]
permissions: {}
jobs:
  evaluate:
    if: >-
      github.run_number == '1' && github.run_attempt == '1' &&
      github.event_name == 'workflow_run' && github.event.action == 'completed' &&
      github.event.repository.full_name == github.repository &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.head_branch == 'renovate/lock-file-maintenance' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.conclusion == 'success'
    uses: netresearch/.github/.github/workflows/dependency-merge-controller.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    with:
      phase: evaluate
      observe-only: true
      caller-workflow: .github/workflows/dependency-merge-measure-evaluate.yml
      intent-workflow: .github/workflows/dependency-merge-measure-intent.yml
      policy: |
        {
          "version": 2,
          "base_ref": "main",
          "minimum_approvals": 1,
          "safe_updates_only": false,
          "required_checks": [
            {
              "name": "All security checks",
              "app_id": 15368,
              "workflow": "checks.yml",
              "events": [
                "pull_request"
              ]
            },
